name: CD — Build e Validacao

on:
  push:
    branches: [main]

permissions:
  contents: read

defaults:
  run:
    working-directory: ./backend

jobs:
  lint:
    name: Ruff (lint + format)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Verificar lint
        run: ruff check .

      - name: Verificar formatacao
        run: ruff format --check .

  typecheck:
    name: mypy (tipagem estatica)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Verificar tipos
        run: mypy app/

  test:
    name: Pytest (testes)
    runs-on: ubuntu-latest
    needs: [lint, typecheck]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Executar testes com cobertura
        run: pytest --cov=app --cov-report=term-missing --cov-fail-under=80 -v

  # Job 'build' temporariamente desabilitado: nao existe Dockerfile no repo ainda.
  # Criar uma issue dedicada ao empacotamento Docker do auth-service e, quando
  # houver Dockerfile, descomentar este job (e posteriormente adicionar push
  # para ECR + deploy ECS quando houver infra AWS).
