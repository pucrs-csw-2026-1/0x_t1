name: CD — Build e Validacao

on:
  push:
    branches: [main]

permissions:
  contents: read

defaults:
  run:
    working-directory: ./backend

jobs:
  lint:
    name: Ruff (lint + format)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Verificar lint
        run: ruff check .

      - name: Verificar formatacao
        run: ruff format --check .

  typecheck:
    name: mypy (tipagem estatica)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Verificar tipos
        run: mypy app/

  test:
    name: Pytest (testes)
    runs-on: ubuntu-latest
    needs: [lint, typecheck]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Executar testes com cobertura
        env:
          SECRET_KEY: test-secret-key-for-ci
          ALGORITHM: HS256
          ACCESS_TOKEN_EXPIRE_MINUTES: 30
          REFRESH_TOKEN_EXPIRE_DAYS: 7
          AWS_REGION: us-east-1
          AWS_ACCESS_KEY_ID: test
          AWS_SECRET_ACCESS_KEY: test
          DYNAMODB_TABLE_USERS: user
        run: pytest --cov=app --cov-report=term-missing --cov-fail-under=80 -v

  build:
    name: Build da imagem Docker
    runs-on: ubuntu-latest
    needs: [test]
    # O working-directory default e ./backend, mas o build do Docker
    # roda na raiz para conseguir referenciar o contexto inteiro do
    # backend/. Dockerfile esta em backend/Dockerfile.
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4

      - name: Build da imagem
        run: docker build -t auth-service:${{ github.sha }} -f backend/Dockerfile backend/

      # Push para ECR + deploy ECS serao adicionados quando houver infra AWS.
