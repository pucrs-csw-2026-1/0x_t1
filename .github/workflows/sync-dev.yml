name: Sync — Atualizar dev apos merge na main

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  sync:
    name: Sincronizar dev com main
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Merge main em dev
        run: |
          git checkout dev
          git merge origin/main --no-edit
          git push origin dev
