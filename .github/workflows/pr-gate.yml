name: PR Gate — Protecao da main

on:
  pull_request:
    branches: [main]

jobs:
  check-source-branch:
    name: Verificar branch de origem
    runs-on: ubuntu-latest
    steps:
      - name: Bloquear PRs que nao venham de dev
        if: github.head_ref != 'dev'
        run: |
          echo "::error::PRs para main so sao aceitos vindos de dev. Branch atual: ${{ github.head_ref }}"
          exit 1

      - name: Branch permitida
        if: github.head_ref == 'dev'
        run: echo "PR vindo de dev — permitido."
