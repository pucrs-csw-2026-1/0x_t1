name: CI — Lint, Tipagem e Testes

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]

permissions:
  contents: read

defaults:
  run:
    working-directory: ./backend

jobs:
  lint:
    name: Ruff (lint + format)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Verificar lint
        run: ruff check .

      - name: Verificar formatacao
        run: ruff format --check .

  typecheck:
    name: mypy (tipagem estatica)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Verificar tipos
        run: mypy app/

  test:
    name: Pytest (testes)
    runs-on: ubuntu-latest
    needs: [lint, typecheck]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Executar testes com cobertura
        env:
          SECRET_KEY: test-secret-key-for-ci
          # US-28: JWTs assinados em RS256. As chaves de dev versionadas
          # (backend/keys/) são resolvidas pelos paths default das Settings
          # (cwd = ./backend), sem env extra.
          ALGORITHM: RS256
          ACCESS_TOKEN_EXPIRE_MINUTES: 30
          REFRESH_TOKEN_EXPIRE_DAYS: 7
          AWS_REGION: us-east-1
          AWS_ACCESS_KEY_ID: test
          AWS_SECRET_ACCESS_KEY: test
          DYNAMODB_TABLE_USERS: user
        run: pytest --cov=app --cov-report=term-missing --cov-fail-under=80 -v
