# Orquestração da stack local completa do Auth Service.
#
# Serviços:
#   infra      Emulador AWS (Ministack) com DynamoDB local na porta 4566. O
#              estado fica em volume nomeado e o container NÃO é recriado entre
#              `up`s enquanto a config não muda (idempotência do Compose).
#   provision  Provisionamento OPCIONAL via Terraform (infra/provision.sh),
#              isolado no profile `provision` — NÃO sobe no `up` padrão. Em dev
#              o backend já garante a tabela no startup (lifespan), então o
#              provision serve só para exercitar o IaC sob demanda. Mantê-lo fora
#              do caminho crítico evita que uma falha dele derrube o stack todo.
#   backend    API FastAPI (Auth Service). Sobe assim que o `infra` fica
#              saudável (healthcheck) e aponta para o DynamoDB do serviço `infra`.
#
# Uso:
#   docker compose up -d                              # sobe infra + backend
#   docker compose up -d backend                      # reconstrói/reinicia só o backend
#   docker compose --profile provision up provision   # roda o Terraform sob demanda
#   docker compose down                               # para os containers (mantém os dados)
#   docker compose down -v                            # para e apaga os dados (zera a infra)
name: auth-service

services:
  infra:
    image: ministackorg/ministack:latest
    container_name: auth-infra
    ports:
      - "4566:4566"
    environment:
      - AWS_DEFAULT_REGION=us-east-1
      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test
      # Persiste o estado do DynamoDB entre restarts do container.
      - PERSISTENCE=1
    volumes:
      - ministack-data:/var/lib/localstack
    restart: unless-stopped
    # A imagem do Ministack só tem python3 (sem curl/wget), então o healthcheck
    # consulta o endpoint de saúde do LocalStack via urllib.
    healthcheck:
      test:
        - CMD
        - python3
        - -c
        - "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:4566/_localstack/health').getcode()==200 else 1)"
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  provision:
    image: hashicorp/terraform:1.9
    container_name: auth-provision
    # Opt-in: só sobe com `--profile provision`. Fora do `up` padrão para que
    # uma falha de provisionamento não bloqueie o backend (que cria a tabela
    # sozinho em dev via lifespan).
    profiles:
      - provision
    depends_on:
      infra:
        condition: service_healthy
    environment:
      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test
      - AWS_DEFAULT_REGION=us-east-1
      # Faz o provider do Terraform apontar para o Ministack na rede do Compose.
      - TF_VAR_dynamodb_endpoint=http://infra:4566
      - TF_IN_AUTOMATION=1
    volumes:
      - ./infra:/infra:ro
      - tfstate:/state
    entrypoint: ["/bin/sh", "/infra/provision.sh"]
    restart: "no"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: auth-backend
    depends_on:
      infra:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      - APP_ENV=development
      - AWS_REGION=us-east-1
      - AWS_DEFAULT_REGION=us-east-1
      # O repositório lê DYNAMODB_ENDPOINT_URL; AWS_ENDPOINT_URL é o fallback
      # nativo do botocore. Ambos apontam para o serviço `infra`.
      - DYNAMODB_ENDPOINT_URL=http://infra:4566
      - AWS_ENDPOINT_URL=http://infra:4566
      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test
      - DYNAMODB_TABLE_USERS=user
      - ALGORITHM=RS256
      - ACCESS_TOKEN_EXPIRE_MINUTES=30
      - REFRESH_TOKEN_EXPIRE_DAYS=7
      - RSA_PRIVATE_KEY_PATH=keys/dev_private.pem
      - RSA_PUBLIC_KEY_PATH=keys/dev_public.pem
      - JWT_KID=auth-dev-key
      # Tópico SNS de eventos de usuário (US-29). ARN determinístico do
      # Ministack; o publisher usa AWS_ENDPOINT_URL para alcançar o `infra`.
      - SNS_USER_EVENTS_TOPIC_ARN=arn:aws:sns:us-east-1:000000000000:user-events
    restart: unless-stopped

  # Seed em massa de usuários demográficos (US-17). One-shot, opt-in via profile
  # `seed` — NÃO sobe no `up` padrão. Reusa a imagem do backend (tem boto3).
  # Grava ~25k usuários `user_{idx}_{seq}` na tabela `user` e publica uma amostra
  # de UserProfileChanged → consumidos pelo Metrics (user-profile).
  #   docker compose --profile seed run --rm seed-users
  #   AUTH_SEED_FORCE=1 docker compose --profile seed run --rm seed-users
  seed-users:
    build:
      context: ./backend
      dockerfile: Dockerfile
    profiles:
      - seed
    depends_on:
      infra:
        condition: service_healthy
    environment:
      - AWS_ENDPOINT_URL=http://infra:4566
      - AWS_REGION=us-east-1
      - AWS_DEFAULT_REGION=us-east-1
      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test
      - DYNAMODB_TABLE_USERS=user
      - SNS_USER_EVENTS_TOPIC_ARN=arn:aws:sns:us-east-1:000000000000:user-events
      - AUTH_SEED_FORCE=${AUTH_SEED_FORCE:-}
    volumes:
      - ./infra/seed:/seed
    working_dir: /seed
    command: ["python", "seed_users.py"]
    restart: "no"

volumes:
  ministack-data:
  tfstate:
